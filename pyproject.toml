[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "losslearning"
version = "0.1.0"
description = "Local gradient-influence guided adaptive robust classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.2", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "pandas>=2", "PyYAML>=6"]
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.9"]
images = ["torchvision>=0.17"]
[project.scripts]
losslearning-train = "losslearning.experiments:train_main"
losslearning-benchmark = "losslearning.experiments:benchmark_main"
losslearning-ablate = "losslearning.experiments:ablate_main"
losslearning-figures = "losslearning.experiments:figures_main"
losslearning-influence = "losslearning.validation:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
